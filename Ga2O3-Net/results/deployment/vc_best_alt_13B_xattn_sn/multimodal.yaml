# Phase 13B: Cross-stream attention fusion (1-layer Transformer + [CLS] pooling).
# Output dim = 64 (token_dim), NOT 160 — head config must use in_dim: 64.
# ~48k extra params; needs strong regularization (dropout 0.2 inside fusion).
structure_stream:
  embedding_dim: 64
  pretrained_ckpt: checkpoints/pretrained_encoder_v2.pt

composition_stream:
  xenonpy_raw_dim: 290
  hidden_dim: 128
  out_dim: 64
  dropout: 0.1
  cache_file: data/processed/xenonpy_cache.pkl

process_stream:
  in_dim: 18
  continuous_dim: 12
  method_embed_dim: 3
  n_methods: 6
  substrate_embed_dim: 3
  n_substrates: 7
  hidden_dim: 64
  out_dim: 32
  dropout: 0.2

fusion:
  total_dim: 64       # Phase 13B: output is [CLS] token dim, not concat sum
  mode: cross_attn    # Phase 13B
  structure_scale: 1.0
  attention_heads: 4
  attention_dim: 64

scalers:
  process_scaler: data/processed/process_scaler.pkl
  composition_scaler: data/processed/composition_scaler.pkl
