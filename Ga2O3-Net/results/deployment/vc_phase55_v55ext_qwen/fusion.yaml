# Phase 54 V54-A1 — SINCERE + hard-neg + PDR-anchor + self-distill (τ=0.10).
#
# Inherits V53-ζ loss config (fusion_v53z_contrastive_vc.yaml) and:
#   - switches sincere_mode "doi_label" → "chem_sim" (multi-positive over chem buckets)
#   - adds hard-neg mining α=2.0 (Robinson 2020 — chem-close + proc-far up-weighted)
#   - adds pdr_anchor_weight=0.2 (PDR rows anchor a second SINCERE arm)
#   - adds pdr_self_distill (weight=0.1, inverse-variance) on V53-ζ pseudo cache
head:
  type: brouwer
  in_dim: 160
  hidden_dims: [64, 32]
  dropout: 0.30
  output_dim: 1

targets:
  - photo_dark_ratio
  - vacancy_concentration

loss:
  type: combined
  mse_weight: 1.0
  infonce_weight: 0.0
  l2_lambda: 0.0
  infonce_temperature: 0.3
  init_log_var: 0.0
  recon_weight: 0.0
  monotonic_vc_weight: 0.0
  monotonic_vc_within_doi_weight: 2.0
  monotonic_vc_within_doi_min_dconc: 0.05
  monotonic_vc_within_doi_class_aware: true
  monotonic_vc_target_idx: 0
  atmo_ordinal_vc_weight: 1.0
  atmo_ordinal_vc_margin: 0.30
  atmo_ordinal_vc_max_dT: 200.0
  atmo_ordinal_vc_max_dconc: 0.5
  atmo_ordinal_vc_within_doi_only: false
  cross_method_pull_weight: 0.0
  encoder_distill_weight: 0.1
  # V53-ζ infrastructure retained
  contrastive_pdr_vc_weight: 0.3
  contrastive_pdr_vc_temperature: 0.10
  # V54-A1 additions
  sincere_mode: "chem_sim"
  hard_neg_alpha: 2.0
  pdr_anchor_weight: 0.2
  pdr_self_distill:
    weight: 0.1
    path: data/processed/v53z_pseudo_targets_vo.npz
    inverse_variance: true

training:
  epochs: 2000
  learning_rate: 2.0e-4
  encoder_lr: 5.0e-6
  encoder_unfreeze_last_n: 0
  freeze_encoder: true
  weight_decay: 5.0e-6
  hypernet_weight_decay: 0.0
  patience: 300
  cv_folds: 10
  batch_size: 16
  mc_dropout_passes: 20
  mixup_alpha: 0.0
  grad_clip: 1.0

pseudo_labeling:
  enabled: false
  std_threshold: 0.3
  phase2_epochs: 500
  phase2_lr_scale: 0.1
  mc_passes: 20

augmentation:
  concentration_jitter: 0.005
  label_noise_std: 0.0

gp:
  enabled: false
  use_embeddings: true

xgboost:
  n_estimators: 200
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8

data:
  log_transform_targets: true
  mask_noconc_labels: true
  mask_undoped_labels: true
  min_conc_threshold: 0.0
  mask_carrier_vc: true
  exclude_elements: ["N", "H", "Nb", "In"]
  target_standardize: true
  drop_both_nan_rows: false

paths:
  experimental_csv: data/raw/experimental/ga2o3_exp_aug3x_vcinterp_v55.csv
  structures_dir: data/structures
  embeddings_cache: data/processed/stage2_embeddings.pkl
  results_dir: results
